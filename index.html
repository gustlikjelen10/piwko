<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14110d">
<title>Dziennik piw</title>
<style>
:root{--bg:#14110d;--card:#201b15;--line:#322a20;--tx:#f3e9d8;--mut:#a39682;--ac:#e8a317}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 8px;font-size:20px}
.row{display:flex;gap:8px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:90px;resize:vertical}
button{cursor:pointer;width:auto}
button.p{background:var(--ac);color:#1a1200;border:0;font-weight:700}
button.d{color:#e57373}
main{padding:12px 14px 90px;max-width:760px;margin:auto}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.th{width:72px;height:96px;border-radius:10px;object-fit:cover;background:#0006;flex:none}
.ph{display:flex;align-items:center;justify-content:center;font-size:30px}
.in{flex:1;min-width:0}
.nm{font-weight:700}
.sub{color:var(--mut);font-size:14px}
.sc{font-size:22px;font-weight:800;color:var(--ac);flex:none}
.nt{font-size:14px;margin-top:4px;color:#d8ccb8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab{position:fixed;right:16px;bottom:16px;width:60px;height:60px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 14px #0008}
#ov{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:10}
#ov.on{display:block}
form{max-width:760px;margin:auto;padding:14px;display:grid;gap:10px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
#pv{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#0006;display:none}
.rt{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rt button{padding:10px 0;text-align:center}
.rt button.on{background:var(--ac);color:#1a1200;border:0;font-weight:700}
.msg{text-align:center;color:var(--mut);padding:30px}
</style>
</head>
<body>
<header>
  <h1>🍺 Dziennik piw</h1>
  <div class="row">
    <input id="q" placeholder="Szukaj (nazwa, browar, styl, smak)…">
    <select id="so" style="width:130px"><option value="d">Najnowsze</option><option value="r">Ocena</option><option value="n">Nazwa</option></select>
  </div>
</header>
<main id="list"></main>
<button class="p fab" id="add">+</button>

<div id="ov"><form id="f">
  <div class="row"><button type="button" id="x">← Wróć</button><button class="p" style="flex:1">Zapisz</button></div>
  <img id="pv" alt="">
  <label>Zdjęcie <input type="file" id="ph" accept="image/*" capture="environment"></label>
  <label>Nazwa piwa <input id="nm" required></label>
  <label>Browar <input id="br"></label>
  <div class="row">
    <label style="flex:1">Styl <input id="st" placeholder="np. IPA, Stout"></label>
    <label style="width:90px">% alk. <input id="ab" type="number" step="0.1"></label>
  </div>
  <label>Ocena (1–10)</label>
  <div class="rt" id="rt"></div>
  <label>Smak i wrażenia <textarea id="nt" placeholder="np. cytrusy, gorycz, lekko dymne…"></textarea></label>
  <div class="row">
    <label style="flex:1">Gdzie / kupione <input id="pl"></label>
    <label style="flex:1">Data <input id="dt" type="date"></label>
  </div>
  <button type="button" class="d" id="del" style="display:none">Usuń piwo</button>
</form></div>

<script>
let beers=[], cur=null, rating=0, photoUrl='';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  try{const r=await fetch('/api/beers');const d=await r.json();if(!Array.isArray(d))throw 0;beers=d;render();}
  catch(e){$('list').innerHTML='<div class="msg">Nie udało się wczytać danych. Sprawdź, czy w Vercel jest podłączony Blob.</div>';}
}
async function save(){
  const r=await fetch('/api/beers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(beers)});
  if(!r.ok)throw new Error('save');
}
function render(){
  const q=$('q').value.toLowerCase(),s=$('so').value;
  let a=beers.filter(b=>[b.nm,b.br,b.st,b.nt,b.pl].join(' ').toLowerCase().includes(q));
  a.sort((x,y)=>s==='r'?(y.rt||0)-(x.rt||0):s==='n'?x.nm.localeCompare(y.nm,'pl'):(y.dt||'').localeCompare(x.dt||'')||y.id-x.id);
  $('list').innerHTML=a.length?a.map(b=>`<div class="card" data-id="${b.id}">
    ${b.ph?`<img class="th" src="${esc(b.ph)}" loading="lazy">`:'<div class="th ph">🍺</div>'}
    <div class="in"><div class="nm">${esc(b.nm)}</div>
    <div class="sub">${esc([b.br,b.st,b.ab?b.ab+'%':''].filter(Boolean).join(' · '))}</div>
    <div class="nt">${esc(b.nt)}</div><div class="sub">${esc([b.dt,b.pl].filter(Boolean).join(' · '))}</div></div>
    <div class="sc">${b.rt||'–'}</div></div>`).join(''):'<div class="msg">Brak piw. Dodaj pierwsze przyciskiem +</div>';
}
function drawRating(){
  $('rt').innerHTML=Array.from({length:10},(_,i)=>`<button type="button" class="${rating===i+1?'on':''}" data-v="${i+1}">${i+1}</button>`).join('');
}
function open(b){
  cur=b;rating=b?b.rt||0:0;photoUrl=b?b.ph||'':'';
  $('nm').value=b?b.nm:'';$('br').value=b?b.br||'':'';$('st').value=b?b.st||'':'';$('ab').value=b?b.ab||'':'';
  $('nt').value=b?b.nt||'':'';$('pl').value=b?b.pl||'':'';$('dt').value=b?b.dt||'':new Date().toISOString().slice(0,10);
  $('ph').value='';$('pv').style.display=photoUrl?'block':'none';$('pv').src=photoUrl;
  $('del').style.display=b?'block':'none';drawRating();$('ov').classList.add('on');
}
function compress(file){return new Promise((res,rej)=>{
  const img=new Image();img.onload=()=>{const m=1200,k=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.82);};
  img.onerror=rej;img.src=URL.createObjectURL(file);});}

$('ph').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('pv').src=URL.createObjectURL(f);$('pv').style.display='block';
  try{const b=await compress(f);const r=await fetch('/api/upload',{method:'POST',body:b});const d=await r.json();
    if(!d.url)throw 0;photoUrl=d.url;}catch(_){alert('Nie udało się wysłać zdjęcia.');photoUrl='';}
};
$('rt').onclick=e=>{const v=e.target.dataset.v;if(v){rating=rating==+v?0:+v;drawRating();}};
$('add').onclick=()=>open(null);
$('x').onclick=()=>$('ov').classList.remove('on');
$('list').onclick=e=>{const c=e.target.closest('.card');if(c)open(beers.find(b=>b.id==c.dataset.id));};
$('q').oninput=$('so').onchange=render;
$('f').onsubmit=async e=>{
  e.preventDefault();
  const o={id:cur?cur.id:Date.now(),nm:$('nm').value.trim(),br:$('br').value.trim(),st:$('st').value.trim(),
    ab:$('ab').value,rt:rating,nt:$('nt').value.trim(),pl:$('pl').value.trim(),dt:$('dt').value,ph:photoUrl};
  beers=cur?beers.map(b=>b.id===cur.id?o:b):[o,...beers];
  try{await save();$('ov').classList.remove('on');render();}catch(_){alert('Nie udało się zapisać. Spróbuj ponownie.');}
};
$('del').onclick=async()=>{
  if(!confirm('Usunąć to piwo?'))return;
  beers=beers.filter(b=>b.id!==cur.id);
  try{await save();$('ov').classList.remove('on');render();}catch(_){alert('Nie udało się usunąć.');}
};
load();
</script>
</body>
</html>
