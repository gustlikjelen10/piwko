<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a1a08">
<title>Piwko 🍺</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piwko">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1409;--card:#2d2013;--line:#5a3d1c;--tx:#fff3dc;--mut:#c2a77d;--ac:#ffb81f;--ac2:#ff6b3d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.4 "Comic Relief","Comic Sans MS","Comic Neue",cursive;
  background:radial-gradient(circle at 20% 0,#4a2d0f 0,transparent 45%),radial-gradient(circle at 90% 30%,#3b2310 0,transparent 40%),var(--bg);background-attachment:fixed}
input,select,textarea,button{font:inherit;color:var(--tx);background:#3a2918;border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
button{cursor:pointer;width:auto;transition:transform .1s}
button:active{transform:scale(.95)}
button.p{background:linear-gradient(#ffc93c,#ff9d00);color:#2a1700;border:0;font-weight:700;box-shadow:0 3px 0 #b26b00}
button.d{color:#ff8a80;border-color:#7a3a35}
h1{margin:0;font-size:22px;color:var(--ac);text-shadow:2px 2px 0 #00000066}
h2{margin:0 0 8px;font-size:18px;color:var(--ac)}
.wrap{max-width:760px;margin:auto;padding:14px}
.av{display:inline-block;width:var(--s,48px);height:var(--s,48px);border-radius:50%;overflow:hidden;flex:none;border:3px solid var(--ac);background:#0004}
.av svg,.av img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;gap:8px;align-items:center}
.center{text-align:center}
.tile{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--ac)}
.tile .pl{font-size:24px;width:34px;text-align:center;flex:none}
.tile .ri{flex:1;min-width:0}.tile .ri b{display:block;font-size:18px}.tile .ri small{color:var(--mut)}
.tile .cnt{font-size:24px;font-weight:700;color:var(--ac);flex:none}
.top{position:sticky;top:0;z-index:5;background:#1d1409ee;backdrop-filter:blur(6px);border-bottom:3px dashed var(--line);padding:10px 14px}
.top .in{max-width:760px;margin:auto}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;font-weight:700;padding:8px 2px;font-size:14px}
.tabs button.on{background:var(--ac);color:#2a1700;border-color:var(--ac)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;margin-bottom:14px;box-shadow:0 4px 0 #0005}
.sub{color:var(--mut);font-size:13px}
.bar{height:16px;border-radius:10px;background:#0006;overflow:hidden;margin:8px 0;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc93c,#ff6b3d)}
.big{font-size:22px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dw{text-align:center;color:var(--mut);font-size:12px}
.day{position:relative;aspect-ratio:1;border-radius:10px;background:#0003;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 5px;font-size:13px;cursor:pointer}
.day b{position:absolute;right:3px;bottom:2px;font-size:12px}
.day.has{background:#6b4a14}.day.today{outline:2px solid var(--ac)}.day.sel{background:var(--ac);color:#2a1700}
.nav{padding:6px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.st{background:#0003;border-radius:14px;padding:8px 10px}.st b{display:block;font-size:20px;color:var(--ac)}.st span{font-size:12px;color:var(--mut)}
.card{display:flex;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px;margin-bottom:12px;cursor:pointer;box-shadow:0 4px 0 #0005}
.card:nth-child(odd){transform:rotate(-.4deg)}.card:nth-child(even){transform:rotate(.4deg)}
.th{width:76px;height:100px;border-radius:14px;object-fit:cover;background:#0005;flex:none}
.ph{display:flex;align-items:center;justify-content:center;font-size:34px}
.i{flex:1;min-width:0}.nm{font-weight:700;font-size:17px}
.nt{font-size:14px;margin:4px 0;color:#f0dfbd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc{flex:none;text-align:center;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sc b{display:block;font-size:26px;color:var(--ac);line-height:1}.sc span{font-size:12px;color:var(--ac2)}
.again{padding:4px 8px;font-size:13px;background:#4a3318}
.fab{position:fixed;right:16px;bottom:16px;width:64px;height:64px;border-radius:50%;font-size:32px;padding:0;z-index:6}
.ov{position:fixed;inset:0;overflow:auto;z-index:10;display:none;background:var(--bg)}
.ov.on{display:block}
form,.box{max-width:760px;margin:auto;padding:14px;display:grid;gap:10px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
#pv{width:100%;max-height:300px;object-fit:contain;border-radius:16px;background:#0005;display:none}
.rt{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rt button{padding:10px 0;text-align:center}
.rt button.on{background:var(--ac);color:#2a1700;border:0;font-weight:700}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.avs .av{cursor:pointer;opacity:.55;border-color:transparent}.avs .av.sel{opacity:1;border-color:var(--ac)}
.msg{text-align:center;color:var(--mut);padding:30px}
.err{color:#ff8a80;min-height:20px;text-align:center}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:3px solid var(--ac);border-radius:24px;width:100%;max-width:340px;text-align:center;justify-items:center}
.pin{text-align:center;font-size:28px;letter-spacing:12px}
.ck{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:14px}.ck input{width:auto}
.btn2{display:flex;gap:8px;width:100%}.btn2 button{flex:1}
.spr{image-rendering:pixelated;width:128px;height:128px;border-radius:14px;border:3px solid var(--ac);background:#0004}
.bigemo{font-size:90px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bd{text-align:center;background:#0003;border-radius:16px;padding:8px;font-size:13px}
.bd .spr{width:84px;height:84px}
.bd.lock .spr{filter:brightness(0) opacity(.35)}
.rrow{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:8px;font-size:14px}
.rrow.me{background:var(--ac);color:#2a1700;font-weight:700}
details summary{cursor:pointer;font-weight:700;color:var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac);color:#2a1700;padding:10px 16px;border-radius:20px;font-weight:700;z-index:30;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>

<div id="login" class="wrap center">
  <h1 style="font-size:34px;margin-top:18px">🍺 Piwko 🍻</h1>
  <p class="sub">🏆 Ranking piwoszy. Kliknij swój profil, żeby wejść</p>
  <div id="tiles"></div>
  <button class="p" id="newU">+ Nowy użytkownik</button>
</div>

<div id="app" style="display:none">
  <div class="top"><div class="in">
    <div class="row"><span id="meAv"></span><h1 style="flex:1" id="meName"></h1><button id="out">Wyjdź</button></div>
    <div class="tabs" id="tabs">
      <button data-t="home" class="on">🏠 Start</button><button data-t="beers">🍺 Piwa</button><button data-t="wish">🎯 Cel</button><button data-t="badges">🏅 Rangi</button>
    </div>
  </div></div>
  <main class="wrap" id="list" style="padding-bottom:100px"></main>
  <button class="p fab" id="add">+</button>
</div>

<div class="modal" id="pm"><div class="box">
  <span id="pmAv"></span><h1 id="pmName"></h1>
  <input class="pin" id="pmPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
  <label class="ck"><input type="checkbox" id="pmRem" checked> Zapamiętaj mnie na tym urządzeniu</label>
  <div class="err" id="pmErr"></div>
  <div class="btn2"><button id="pmNo">Anuluj</button><button class="p" id="pmOk">Wejdź</button></div>
</div></div>

<div class="modal" id="bm"><div class="box">
  <div id="bmImg"></div><h1 id="bmT"></h1><div class="big" id="bmN"></div><div class="sub" id="bmX"></div>
  <button class="p" id="bmOk" style="width:100%">Super! 🍻</button>
</div></div>

<div id="toast"></div>

<div class="ov" id="reg"><form id="rf">
  <h1>Nowy użytkownik</h1>
  <label>Imię / ksywa <input id="rn" maxlength="20" required></label>
  <label>Awatar</label><div class="avs" id="avs"></div>
  <label>PIN (4 cyfry) <input id="rp" class="pin" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" required></label>
  <div class="err" id="rerr"></div>
  <div class="btn2"><button type="button" id="rx">Wróć</button><button class="p">Utwórz</button></div>
</form></div>

<div class="ov" id="ov"><form id="f">
  <div class="row"><button type="button" id="x">← Wróć</button><button class="p" style="flex:1">Zapisz 🍺</button></div>
  <img id="pv" alt="">
  <label>Zdjęcie</label>
  <div class="row"><button type="button" id="b1" style="flex:1">📷 Zrób zdjęcie</button><button type="button" id="b2" style="flex:1">🖼️ Z galerii</button></div>
  <button type="button" id="rb">🔍 Rozpoznaj piwo ze zdjęcia</button>
  <div class="sub" id="rs"></div>
  <input type="file" id="ph" accept="image/*" capture="environment" hidden>
  <input type="file" id="ph2" accept="image/*" hidden>
  <label>Nazwa piwa <input id="nm" required></label>
  <label>Browar <input id="br"></label>
  <div class="row">
    <label style="flex:1">Styl <input id="st" placeholder="np. IPA, Stout"></label>
    <label style="width:90px">% alk. <input id="ab" type="number" step="0.1"></label>
    <label style="width:100px">Cena zł <input id="pr" type="number" step="0.01"></label>
  </div>
  <label>Ocena (1–10)</label><div class="rt" id="rt"></div>
  <label>Smak i wrażenia <textarea id="nt" placeholder="np. cytrusy, gorycz, lekko dymne…"></textarea></label>
  <div class="row">
    <label style="flex:1">Gdzie piłem / kupiłem <input id="pl"></label>
    <label style="flex:1">Data <input id="dt" type="date"></label>
  </div>
  <div class="sub" id="inf" style="display:none"></div>
  <button type="button" class="p" id="ag" style="display:none">➕ Wypiłem to piwo ponownie (dziś)</button>
  <button type="button" class="d" id="del" style="display:none">Usuń piwo</button>
</form></div>

<div class="ov" id="wov"><form id="wf">
  <div class="row"><button type="button" id="wx">← Wróć</button><button class="p" style="flex:1">Zapisz 🎯</button></div>
  <label>Nazwa piwa <input id="wnm" required></label>
  <label>Browar <input id="wbr"></label>
  <label>Styl <input id="wst"></label>
  <label>Gdzie szukać / dlaczego chcę <textarea id="wnt"></textarea></label>
  <button type="button" class="d" id="wdel" style="display:none">Usuń z listy</button>
</form></div>

<script src="/ranks.js"></script>
<script src="/badges.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const norm=s=>String(s||'').trim().toLowerCase();
const MON=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const DOW=['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const F=(x,y,c='#3b2a14')=>`<circle cx="${x-5}" cy="${y}" r="2.2" fill="${c}"/><circle cx="${x+5}" cy="${y}" r="2.2" fill="${c}"/><path d="M${x-4} ${y+5}q4 4 8 0" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
const S='stroke="#4a2c00" stroke-width="2.5"';
const AV={
b1:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#ffe0a0"/><path d="M43 28h5a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-5" fill="none" ${S}/><rect x="17" y="22" width="26" height="30" rx="5" fill="#f2a900" ${S}/><circle cx="22" cy="22" r="6" fill="#fff"/><circle cx="30" cy="19" r="7" fill="#fff"/><circle cx="38" cy="22" r="6" fill="#fff"/>${F(30,38)}</svg>`,
b2:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#bfe3ff"/><rect x="20" y="10" width="24" height="44" rx="5" fill="#e8573f" ${S}/><rect x="20" y="24" width="24" height="16" fill="#fff"/><rect x="24" y="8" width="16" height="4" rx="2" fill="#c9ccd1" ${S}/>${F(32,31)}</svg>`,
b3:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#f6c6d8"/><path d="M19 10h26c0 16-4 25-13 25S19 26 19 10z" fill="#fff" stroke="#5b1030" stroke-width="2.5"/><path d="M20.5 20h23c-1 9-5 13-11.5 13S21.5 29 20.5 20z" fill="#a4143a"/><rect x="30.5" y="35" width="3" height="14" fill="#5b1030"/><ellipse cx="32" cy="51" rx="11" ry="3.5" fill="#5b1030"/>${F(32,25,'#fff')}</svg>`,
b4:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#d9c7ff"/><path d="M17 14h30l-3 38H20z" fill="#ffffff88" stroke="#3a2a60" stroke-width="2.5"/><path d="M19 28h26l-1.5 24h-23z" fill="#d98a1f"/><rect x="22" y="22" width="11" height="11" rx="2" fill="#ffffffaa" stroke="#7fb4d9" stroke-width="1.5" transform="rotate(-12 27 27)"/><rect x="34" y="29" width="9" height="9" rx="2" fill="#ffffffaa" stroke="#7fb4d9" stroke-width="1.5" transform="rotate(10 38 33)"/>${F(32,44)}</svg>`,
b5:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#c9f0c0"/><path d="M27 8h10v12c0 4 7 6 7 14v18a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V34c0-8 7-10 7-14z" fill="#2f8f46" stroke="#14502a" stroke-width="2.5"/><rect x="26" y="5" width="12" height="5" rx="2" fill="#ffb81f" stroke="#14502a" stroke-width="2"/><rect x="21.5" y="35" width="21" height="15" fill="#fff"/>${F(32,41)}</svg>`
};
const BK=Object.keys(AV);
const av=(a,s=48)=>`<span class="av" style="--s:${s}px">${AV[a]||`<img src="${esc(a)}" alt="">`}</span>`;

/* ogólny piksel-art ludzik (nie podobizna prawdziwej osoby), generowany z nazwy */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(a){return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const spr={};
function sprite(name){
  if(spr[name])return spr[name];
  const r=rng(hash(name)),pick=a=>a[Math.floor(r()*a.length)];
  const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext&&c.getContext('2d');if(!g)return '';
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  const bg=pick(['#ffd98a','#bfe3ff','#f6c6d8','#c9f0c0','#d9c7ff','#ffb88a']),skin=pick(['#f5cfa0','#e8b27c','#c68b59','#8d5a3b']);
  const hair=pick(['#2b1b0e','#6b3d14','#c9a227','#8a8a8a','#b5441c','#111']),shirt=pick(['#d33','#2a7fd4','#2e9e4f','#e8a317','#7b3fc4','#222']),hat=pick(['#444','#a33','#246','#664']);
  R(0,0,16,16,bg);R(0,14,16,2,'#0003');
  R(4,10,8,6,shirt);R(3,11,1,4,shirt);R(12,11,1,3,shirt);R(5,3,6,7,skin);
  const hs=Math.floor(r()*4);
  if(hs===0)R(5,2,6,2,hair);else if(hs===1){R(5,2,6,2,hair);R(4,3,1,4,hair);R(11,3,1,4,hair);}else if(hs===2)R(5,3,6,1,hair);else{R(4,2,8,2,hair);R(4,4,1,2,hair);R(11,4,1,2,hair);}
  if(r()<.35){R(5,5,3,3,'#222');R(8,5,3,3,'#222');R(6,6,1,1,'#fff');R(9,6,1,1,'#fff');}else{R(6,6,1,1,'#111');R(9,6,1,1,'#111');}
  const mus=r()<.5,beard=r()<.25;
  if(beard)R(5,8,6,2,hair);else{R(7,9,2,1,'#b33');}
  if(mus)R(6,8,4,1,hair);
  if(r()<.4){R(4,1,8,2,hat);R(3,3,10,1,hat);}
  R(12,8,3,4,'#f2a900');R(12,7,3,1,'#fff');R(15,9,1,2,'#f2a900');R(12,12,2,1,skin);
  return spr[name]=c.toDataURL();
}

let users=[],me=null,data={beers:[],wish:[]},tab='home',cur=null,curW=null,rating=0,photoUrl='',fromWish=null,pendU=null,regAv='b1',lastBlob=null;
const nowD=new Date();let calY=nowD.getFullYear(),calM=nowD.getMonth(),sel='';

const H=()=>({'Content-Type':'application/json','x-user':me.id,'x-pin':me.pin});
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json();}catch(_){}if(!r.ok)throw Object.assign(new Error(d.error||'Błąd'),{status:r.status});return d;}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(_){}}
function recall(k){try{return JSON.parse(localStorage.getItem(k));}catch(_){return null;}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600);}

/* dane: każde piwo = pierwsze wypicie (dt, pr) + kolejne w more[] */
const drinks=b=>[{d:b.dt||'',pr:b.pr}].concat(b.more||[]);
const allDrinks=()=>data.beers.flatMap(b=>drinks(b).map(x=>({d:x.d,pr:x.pr,b})));
const totalDrinks=()=>data.beers.reduce((s,b)=>s+drinks(b).length,0);
function badgeSet(){const s=new Set();allDrinks().forEach(x=>{const md=(x.d||'').slice(5);BADGES.forEach(b=>{if(b.d.includes(md))s.add(b.n);});});return s;}
const dm=k=>k.slice(3)+'.'+k.slice(0,2);
const GEN=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const fmtD=k=>(+k.slice(3))+' '+GEN[+k.slice(0,2)-1];

async function save(){await api('/api/data',{method:'POST',headers:H(),body:JSON.stringify(data)});}
async function commit(fn){
  const old=JSON.stringify(data),bs=badgeSet(),r0=rankIndex(totalDrinks());
  fn();
  try{await save();}catch(_){data=JSON.parse(old);alert('Nie udało się zapisać. Spróbuj ponownie.');render();return false;}
  render();
  const a=badgeSet(),q=[],r1=rankIndex(totalDrinks());
  if(r1>r0)q.push({kind:'rank',i:r1});
  BADGES.filter(b=>a.has(b.n)&&!bs.has(b.n)).forEach(b=>q.push({kind:'badge',b}));
  showQueue(q);return true;
}
let Q=[];
function showQueue(a){Q=Q.concat(a);if(!$('bm').classList.contains('on'))nextPop();}
function nextPop(){
  const x=Q.shift();if(!x){$('bm').classList.remove('on');return;}

  else{$('bmImg').innerHTML='<div class="bigemo pop">🎖️</div>';$('bmT').textContent='⬆️ Awans!';$('bmN').textContent=RANKS[x.i];$('bmX').textContent='Twoja nowa ranga ('+rangeLabel(x.i)+' piw)';}

/* zakładki */
function setTab(t){
  tab=t;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('add').style.display='block';render();window.scrollTo(0,0);
}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.t);};

function stats(L){
  const n=L.length,uniq=new Set(L.map(x=>x.b.id)).size,sp=L.reduce((s,x)=>s+(+x.pr||0),0);
  const rated=L.filter(x=>+x.b.rt),avg=rated.length?rated.reduce((s,x)=>s+ +x.b.rt,0)/rated.length:null;
  return {n,uniq,sp,avg};
}
const box=(v,l)=>`<div class="st"><b>${v}</b><span>${l}</span></div>`;
const money=v=>v.toFixed(2).replace('.',',')+' zł';

function bdayBanner(){
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),earned=badgeSet(),md=today().slice(5);
  const tod=BADGES.filter(b=>b.d.includes(md));
  if(tod.length)return `<div class="panel">🎂 <b>Dziś urodziny:</b> ${tod.map(b=>esc(b.n)+(earned.has(b.n)?' ✅':'')).join(', ')}.${tod.some(b=>!earned.has(b.n))?'<br><span class="sub">Wypij dziś piwo, żeby zdobyć odznakę!</span>':''}</div>`;
  let best=null;
  BADGES.forEach(b=>b.d.forEach(k=>{const m=+k.slice(0,2),d=+k.slice(3);let dt=new Date(now.getFullYear(),m-1,d);if(dt<t0)dt=new Date(now.getFullYear()+1,m-1,d);const n=Math.round((dt-t0)/864e5);if(!best||n<best.n)best={n,b};}));
  return best?`<div class="panel sub">🎂 Najbliższe urodziny: <b>${esc(best.b.n)}</b> za ${best.n} ${best.n===1?'dzień':'dni'}</div>`:'';
}
function homeHTML(){
  const n=totalDrinks(),i=rankIndex(n),to=rankTo(i),from=rankFrom(i);
  const pct=to===null?100:Math.min(100,Math.round((n-from)/(to-from)*100));
  const rank=`<div class="panel"><div class="sub">Twoja ranga</div><div class="big">🏅 ${esc(RANKS[i])}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sub">${n} wypitych piw${to===null?'. To jest najwyższa ranga!':' · do awansu brakuje '+(to-n)+' · następna: '+esc(RANKS[i+1])}</div></div>`;
  const L=allDrinks().filter(x=>x.d),by={};L.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));
  const first=new Date(calY,calM,1),dim=new Date(calY,calM+1,0).getDate(),off=(first.getDay()+6)%7;
  let cells=DOW.map(d=>`<div class="dw">${d}</div>`).join('')+'<div></div>'.repeat(off);
  for(let d=1;d<=dim;d++){const k=calY+'-'+pad(calM+1)+'-'+pad(d),c=(by[k]||[]).length;
    cells+=`<div class="day ${c?'has':''} ${k===today()?'today':''} ${k===sel?'sel':''}" data-k="${k}">${d}${c?`<b>🍺${c>1?c:''}</b>`:''}</div>`;}
  const detail=sel&&by[sel]?`<div style="margin-top:8px"><div class="sub">${sel.split('-').reverse().join('.')}</div>${by[sel].map(x=>`<div>🍺 ${esc(x.b.nm)} ${x.b.rt?'<span class="sub">(⭐ '+x.b.rt+'/10)</span>':''}</div>`).join('')}</div>`:(sel?'<div class="sub" style="margin-top:8px">Tego dnia nic nie wypito.</div>':'');
  const cal=`<div class="panel"><div class="row"><button class="nav" data-d="-1">‹</button><h2 style="flex:1;text-align:center;margin:0">📅 ${MON[calM]} ${calY}</h2><button class="nav" data-d="1">›</button></div><div class="cal">${cells}</div>${detail}</div>`;
  const mk=calY+'-'+pad(calM+1),ms=stats(L.filter(x=>x.d.startsWith(mk)));
  const month=`<div class="panel"><h2>📊 ${MON[calM]}</h2><div class="grid">${box(ms.n,'wypitych piw')}${box(ms.uniq,'różnych piw')}${box(money(ms.sp),'wydane')}${box(ms.avg==null?'–':ms.avg.toFixed(1),'średnia ocena')}</div></div>`;
  const A=allDrinks(),as=stats(A),sc={};A.forEach(x=>{const s=(x.b.st||'').trim();if(s)sc[s]=(sc[s]||0)+1;});
  const topSt=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  const best=[...data.beers].filter(b=>+b.rt).sort((a,b)=>b.rt-a.rt||drinks(b).length-drinks(a).length)[0];
  const most=[...data.beers].sort((a,b)=>drinks(b).length-drinks(a).length)[0];
  const all=`<div class="panel"><h2>🏆 Ogółem</h2><div class="grid">${box(as.n,'wypitych piw')}${box(as.uniq,'różnych piw')}${box(money(as.sp),'wydane łącznie')}${box(as.avg==null?'–':as.avg.toFixed(1),'średnia ocena')}</div>
    <div style="margin-top:8px" class="sub">${topSt?'Ulubiony styl: <b>'+esc(topSt[0])+'</b> ('+topSt[1]+'×)<br>':''}${best?'Najwyżej oceniane: <b>'+esc(best.nm)+'</b> ('+best.rt+'/10)<br>':''}${most&&drinks(most).length>1?'Najczęściej pite: <b>'+esc(most.nm)+'</b> ('+drinks(most).length+'×)':''}</div></div>`;
  return bdayBanner()+rank+cal+month+all;
}
function beersHTML(){
  const a=[...data.beers].sort((x,y)=>{const lx=drinks(x).map(d=>d.d).sort().pop()||'',ly=drinks(y).map(d=>d.d).sort().pop()||'';return ly.localeCompare(lx)||y.id-x.id;});
  return a.length?a.map(x=>{const n=drinks(x).length;return `<div class="card" data-id="${x.id}">
    ${x.ph?`<img class="th" src="${esc(x.ph)}" loading="lazy">`:'<div class="th ph">🍺</div>'}
    <div class="i"><div class="nm">${esc(x.nm)}${n>1?' <span class="sub">×'+n+'</span>':''}</div><div class="sub">${esc([x.br,x.st,x.ab?x.ab+'%':''].filter(Boolean).join(' · '))}</div>
    <div class="nt">${esc(x.nt)}</div><div class="sub">${esc([x.dt,x.pl,x.pr?(+x.pr).toFixed(2)+' zł':''].filter(Boolean).join(' · '))}</div></div>
    <div class="sc"><b>${x.rt||'–'}</b><span>/10</span><button class="again" data-id="${x.id}">+1 🍺</button></div></div>`;}).join(''):'<div class="msg">Pusto! Dodaj pierwsze piwo przyciskiem +</div>';
}
function wishHTML(){
  return data.wish.length?data.wish.map(x=>`<div class="card" data-id="${x.id}"><div class="th ph" style="width:56px;height:56px">🎯</div>
    <div class="i"><div class="nm">${esc(x.nm)}</div><div class="sub">${esc([x.br,x.st].filter(Boolean).join(' · '))}</div><div class="nt">${esc(x.nt)}</div></div>
    <button class="p drank" data-id="${x.id}" style="align-self:center">Wypiłem ✓</button></div>`).join(''):'<div class="msg">Nic nie ścigasz. Dopisz piwo, na które polujesz!</div>';
}
function badgesHTML(){
  const earned={};allDrinks().forEach(x=>{const md=(x.d||'').slice(5);BADGES.forEach(b=>{if(b.d.includes(md)&&!earned[b.n])earned[b.n]=x.d;});});
  const bg=`<div class="panel"><h2>🏅 Odznaki urodzinowe (${Object.keys(earned).length}/${BADGES.length})</h2><div class="sub" style="margin-bottom:8px">Wypij piwo w dniu urodzin tej postaci, żeby zdobyć odznakę. Ludziki są ogólne, to nie podobizny prawdziwych osób.</div>
    <div class="bgrid">${BADGES.slice().sort((a,b)=>(earned[b.n]?1:0)-(earned[a.n]?1:0)||a.d[0].localeCompare(b.d[0])).map(b=>{const e=earned[b.n];return `<div class="bd ${e?'':'lock'}"><img class="spr" src="${sprite(b.n)}" alt=""><div><b>${esc(b.n)}</b></div><div class="sub">${e?'✅ zdobyta '+e.split('-').reverse().join('.'):'🔒 '+b.d.map(dm).join(' lub ')}</div></div>`;}).join('')}</div></div>`;
  const n=totalDrinks(),ci=rankIndex(n);
  const rk=`<div class="panel"><details><summary>📜 Wszystkie rangi (${RANKS.length})</summary><div style="margin-top:8px">${RANKS.map((t,i)=>`<div class="rrow ${i===ci?'me':''}"><span>${esc(t)}</span><span>${rangeLabel(i)}</span></div>`).join('')}</div></details></div>`;
  return bg+rk;
}
function render(){
  if(!me)return;
  $('list').innerHTML=tab==='home'?homeHTML():tab==='beers'?beersHTML():tab==='wish'?wishHTML():badgesHTML();
}
$('list').onclick=async e=>{
  const nv=e.target.closest('.nav');if(nv){calM+=+nv.dataset.d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}sel='';render();return;}
  const dy=e.target.closest('.day');if(dy){sel=sel===dy.dataset.k?'':dy.dataset.k;render();return;}
  const ag=e.target.closest('.again');
  if(ag){e.stopPropagation();const b=data.beers.find(x=>x.id==ag.dataset.id);
    if(await commit(()=>{b.more=(b.more||[]).concat({d:today(),pr:b.pr||''});}))toast('Dopisane! Kolejne '+b.nm+' 🍻');return;}
  const dr=e.target.closest('.drank');
  if(dr){const w=data.wish.find(x=>x.id==dr.dataset.id);fromWish=w.id;openBeer({nm:w.nm,br:w.br,st:w.st,nt:''},true);return;}
  const c=e.target.closest('.card');if(!c)return;
  if(tab==='beers')openBeer(data.beers.find(x=>x.id==c.dataset.id));else if(tab==='wish')openWish(data.wish.find(x=>x.id==c.dataset.id));
};
$('add').onclick=()=>tab==='wish'?openWish(null):openBeer(null);

/* formularz piwa */
function drawRating(){$('rt').innerHTML=Array.from({length:10},(_,i)=>`<button type="button" class="${rating===i+1?'on':''}" data-v="${i+1}">${i+1}</button>`).join('');}
function openBeer(b,pre){
  if(!pre)fromWish=null;cur=pre?null:b;rating=b&&!pre?b.rt||0:0;photoUrl=b&&!pre?b.ph||'':'';
  $('nm').value=b?b.nm||'':'';$('br').value=b?b.br||'':'';$('st').value=b?b.st||'':'';$('ab').value=b&&!pre?b.ab||'':'';$('pr').value=b&&!pre?b.pr||'':'';
  $('nt').value=b?b.nt||'':'';$('pl').value=b&&!pre?b.pl||'':'';$('dt').value=b&&!pre?b.dt||'':today();
  $('ph').value='';$('ph2').value='';lastBlob=null;$('rs').textContent='';$('pv').src=photoUrl;$('pv').style.display=photoUrl?'block':'none';
  const ed=!!cur;$('del').style.display=ed?'block':'none';$('ag').style.display=ed?'block':'none';
  $('inf').style.display=ed?'block':'none';if(ed)$('inf').textContent='Wypite razy: '+drinks(cur).length+(cur.more&&cur.more.length?' (kolejne: '+cur.more.map(x=>x.d.split('-').reverse().join('.')).join(', ')+')':'');
  drawRating();$('ov').classList.add('on');
}
function compress(file,m=1200,sq=false){return new Promise((res,rej)=>{
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),g=c.getContext('2d');
    if(sq){const s=Math.min(img.width,img.height);c.width=c.height=m;g.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,m,m);}
    else{const k=Math.min(1,m/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;g.drawImage(img,0,0,c.width,c.height);}
    c.toBlob(b=>b?res(b):rej(),'image/jpeg',.82);};img.onerror=rej;img.src=URL.createObjectURL(file);});}
$('b1').onclick=()=>$('ph').click();$('b2').onclick=()=>$('ph2').click();
async function recognize(){
  if(!lastBlob){alert('Najpierw dodaj zdjęcie.');return;}
  const s=$('rs');s.textContent='🔍 Rozpoznaję piwo…';
  try{
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),50000);
    let d;try{d=await api('/api/recognize',{method:'POST',body:lastBlob,signal:ac.signal});}finally{clearTimeout(to);}
    let n=0;
    ['nm','br','st','ab'].forEach(k=>{if(d[k]&&!$(k).value){$(k).value=d[k];n++;}});
    s.textContent=n?'✅ Uzupełnione. Sprawdź i popraw, jeśli trzeba.':'🤷 Nic nie rozpoznałem, wpisz ręcznie. (odpowiedź AI: '+(d.raw||'pusta')+')';
  }catch(e){s.textContent=e.name==='AbortError'?'⚠️ To trwa za długo. Kliknij „Rozpoznaj piwo” jeszcze raz.':'⚠️ Nie udało się rozpoznać: '+e.message;}
}
$('rb').onclick=recognize;
$('ph').onchange=$('ph2').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;$('pv').src=URL.createObjectURL(f);$('pv').style.display='block';
  try{lastBlob=await compress(f);}catch(_){alert('Nie udało się wczytać zdjęcia.');return;}
  recognize();
  try{const d=await api('/api/upload',{method:'POST',body:lastBlob});photoUrl=d.url;}catch(_){alert('Nie udało się wysłać zdjęcia.');photoUrl='';}
};
$('rt').onclick=e=>{const v=e.target.dataset.v;if(v){rating=rating==+v?0:+v;drawRating();}};
$('x').onclick=()=>$('ov').classList.remove('on');
function afterSave(){$('ov').classList.remove('on');if(fromWish){fromWish=null;setTab('beers');}}
$('f').onsubmit=async e=>{
  e.preventDefault();
  const o={id:cur?cur.id:Date.now(),nm:$('nm').value.trim(),br:$('br').value.trim(),st:$('st').value.trim(),ab:$('ab').value,pr:$('pr').value,
    rt:rating,nt:$('nt').value.trim(),pl:$('pl').value.trim(),dt:$('dt').value,ph:photoUrl,more:cur?cur.more||[]:[]};
  const rmWish=()=>{if(fromWish)data.wish=data.wish.filter(w=>w.id!==fromWish);};
  if(!cur){
    const ex=data.beers.find(b=>norm(b.nm)===norm(o.nm)&&norm(b.br)===norm(o.br));
    if(ex&&confirm('Masz już „'+ex.nm+'” w dzienniku.\n\nOK = dopisz kolejne wypicie do tego piwa\nAnuluj = zapisz jako osobny wpis')){
      if(await commit(()=>{ex.more=(ex.more||[]).concat({d:o.dt,pr:o.pr});rmWish();})){afterSave();toast('Dopisane kolejne wypicie 🍻');}
      return;
    }
  }
  if(await commit(()=>{data.beers=cur?data.beers.map(b=>b.id===cur.id?o:b):[o,...data.beers];rmWish();}))afterSave();
};
$('ag').onclick=async()=>{
  if(!cur)return;const b=cur;
  if(await commit(()=>{b.more=(b.more||[]).concat({d:today(),pr:b.pr||''});})){$('ov').classList.remove('on');toast('Dopisane kolejne wypicie 🍻');}
};
$('del').onclick=async()=>{
  if(!confirm('Usunąć to piwo razem z historią wypić?'))return;
  if(await commit(()=>{data.beers=data.beers.filter(b=>b.id!==cur.id);}))$('ov').classList.remove('on');
};

/* lista celów */
function openWish(w){curW=w;$('wnm').value=w?w.nm:'';$('wbr').value=w?w.br||'':'';$('wst').value=w?w.st||'':'';$('wnt').value=w?w.nt||'':'';
  $('wdel').style.display=w?'block':'none';$('wov').classList.add('on');}
$('wx').onclick=()=>$('wov').classList.remove('on');

  e.preventDefault();const o={id:curW?curW.id:Date.now(),nm:$('wnm').value.trim(),br:$('wbr').value.trim(),st:$('wst').value.trim(),nt:$('wnt').value.trim()};
  if(await commit(()=>{data.wish=curW?data.wish.map(w=>w.id===curW.id?o:w):[o,...data.wish];}))$('wov').classList.remove('on');

$('wdel').onclick=async()=>{
  if(!confirm('Usunąć z listy?'))return;
  if(await commit(()=>{data.wish=data.wish.filter(w=>w.id!==curW.id);}))$('wov').classList.remove('on');
};

(async()=>{
  const s=recall('piwko');
  if(s){try{users=await api('/api/users');const u=users.find(x=>x.id===s.id);if(u){await enter(u,s.pin,true);return;}}catch(_){}store('piwko',null);}
  showLogin();
})();
